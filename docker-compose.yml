services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      FALKORDB_URL: redis://falkordb:6379
    ports: ["8000:8000"]
    depends_on: [falkordb]
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports: ["5173:80"]
    depends_on: [backend]
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379"]
